services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: slotwise
      POSTGRES_USER: slotwise
      POSTGRES_PASSWORD: slotwise
    ports:
      - "5432:5432"
    volumes:
      - slotwise-postgres:/var/lib/postgresql/data
      # Only runs on a fresh (empty) data dir — see postgres/primary-init.sh for why.
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/primary-init.sh:ro
      # audit-service's own database + user (Fase 4); same fresh-volume-only caveat.
      - ./postgres/audit-init.sh:/docker-entrypoint-initdb.d/audit-init.sh:ro
      # notification-service's own database + user (Fase 4); same fresh-volume-only caveat.
      - ./postgres/notification-init.sh:/docker-entrypoint-initdb.d/notification-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotwise -d slotwise"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Streaming replication read replica — Fase 2 "Replication (Read Replicas,
  # Primary-Replica)". Hot standby: read-only, continuously replaying the primary's WAL.
  # See postgres/replica-entrypoint.sh for how the initial clone + standby signal work.
  postgres-replica:
    image: postgres:17
    entrypoint: ["/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - slotwise-postgres-replica:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotwise -d slotwise"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Fase 3 "Cache-Aside" — ResourceService.getById is @Cacheable against this.
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Fase 4 "Kafka" kickoff. KRaft mode (no Zookeeper — Kafka's own newer consensus
  # protocol, standard for anything started fresh today) single broker, combined
  # broker+controller roles. Two listeners: PLAINTEXT for other containers (none yet, but
  # matches the official example so it's not a special case to remember later), PLAINTEXT_HOST
  # for booking-service running on the host (mvn spring-boot:run) via localhost:9092.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # The public name Keycloak writes as `iss` in every token, whatever host the request came by. The services' KEYCLOAK_ISSUER_URI must be the same value.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  # Fase 4 "observability" — where the three services send their telemetry. They speak OTLP to the Collector (4318 =
  # OTLP/HTTP, what Spring exports by default) and never to a backend directly, so the backend can change (an AWS ADOT
  # collector, Elastic, SigNoz...) by editing otel/collector-config.yaml only. contrib distribution because it also
  # carries the AWS exporters (awsxray, awsemf) for later.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - lgtm

  # Grafana (http://localhost:3000, admin/admin) + Loki (logs) + Tempo (traces) + Prometheus (metrics) in one dev
  # image; it has its own OTLP receiver, which only the Collector talks to. Data is ephemeral (lost with the container).
  # The dashboard under grafana/dashboards is provisioned from this repo.
  lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/slotwise-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/slotwise-dashboards.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/slotwise-dashboards:ro
      - ./grafana/provisioning/alerting/slotwise-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/slotwise-alerts.yaml:ro

  # Fase 5 — the three services, built from the one root Dockerfile (--build-arg SERVICE). Inside the compose network every address is a service name
  # (`localhost` would be the container itself). The Keycloak issuer is the PUBLIC name written in the token; the keys are fetched by service name (see decisions.md).
  # Start everything: `docker compose up -d --build`. The ports published here are the same as when a service runs on the host, so stop one before the other.
  booking-service:
    build:
      context: .
      args:
        SERVICE: booking-service
    image: slotwise/booking-service:dev
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_REPLICA_HOST: postgres-replica
      DB_REPLICA_PORT: 5432
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/slotwise
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/slotwise/protocol/openid-connect/certs
    depends_on:
      postgres: {condition: service_healthy}
      postgres-replica: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      otel-collector: {condition: service_started}
    # No curl in the JRE image: bash's /dev/tcp sends the HTTP request and the response must say UP.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  audit-service:
    build:
      context: .
      args:
        SERVICE: audit-service
    image: slotwise/audit-service:dev
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/slotwise
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/slotwise/protocol/openid-connect/certs
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # No HTTP server, so no port and no HTTP healthcheck (see decisions.md).
  notification-service:
    build:
      context: .
      args:
        SERVICE: notification-service
    image: slotwise/notification-service:dev
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_BASE_URL: http://keycloak:8080
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      keycloak: {condition: service_started}
      otel-collector: {condition: service_started}

volumes:
  slotwise-postgres:
  slotwise-postgres-replica:
