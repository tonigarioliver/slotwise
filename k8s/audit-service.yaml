# audit-service: consumes reservation-events into its own database. Shared addresses come from the ConfigMap `slotwise-config`, its database
# credentials from the Secret `audit-db`, both generated by the root kustomization.yaml. Telemetry has no Collector in the cluster yet (COLLECTOR_URL
# keeps the image's default), so the exporters log connection errors until one exists; the service works regardless.
apiVersion: v1
kind: Service
metadata:
  name: audit-service
spec:
  selector:
    app: audit-service
  ports:
    - port: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: slotwise/audit-service:dev
          # The image only exists in the node (copied by scripts/kind-up.sh), so never try to pull it.
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: slotwise-config
            - secretRef:
                name: audit-db
          # Kubernetes makes these HTTP calls itself (the image has no curl). A Spring Boot app takes a while to start, so the startup probe gives it
          # up to 60 s before the other two begin; while it fails Kubernetes does not restart the Pod or send traffic to it.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8082}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            periodSeconds: 10
