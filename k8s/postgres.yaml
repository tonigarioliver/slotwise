# Postgres primary. The ConfigMap `postgres-init` (the init scripts from postgres/) and the Secret `postgres-secret` are generated by the
# kustomization.yaml at the repository root; the read replica is in postgres-replica.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: slotwise
            - name: POSTGRES_USER
              value: slotwise
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            # A subdirectory of the volume: the volume's own root may hold files (lost+found) that make initdb refuse to start.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "slotwise", "-d", "slotwise"]
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  # One disk per Pod, created from this template and kept when the Pod is recreated.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
