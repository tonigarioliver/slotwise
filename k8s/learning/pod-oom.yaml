# Learning: redis (the container's main process) with a 20 MiB memory LIMIT. We fill it from outside with `kubectl exec ... debug populate`; when it passes
# the limit the kernel kills it and Kubernetes reports OOMKilled. (Redis 7 forbids DEBUG unless enable-debug-command is set.)
apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  containers:
    - name: redis
      image: redis:7
      command: ["redis-server", "--save", "", "--enable-debug-command", "yes"]
      resources:
        limits:
          memory: 20Mi
