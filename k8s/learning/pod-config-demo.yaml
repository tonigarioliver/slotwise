apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: demo
      image: redis:7
      command: ["sh", "-c", "env | grep -E 'REDIS_HOST|KAFKA|DB_' | sort; sleep 3600"]
      envFrom:
        - configMapRef:
            name: slotwise-config      # every key of the ConfigMap becomes an environment variable
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: slotwise-db        # one key of a Secret
              key: password
