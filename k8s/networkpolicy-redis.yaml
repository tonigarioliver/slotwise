# Without a NetworkPolicy every Pod can reach every other Pod. Once a Pod is selected by one, it only accepts what some rule allows.
# Redis is only used by booking-service (cache, rate limit, locks), so only those Pods may connect to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-only-from-booking
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: booking-service
      ports:
        - port: 6379
