# Streaming read replica of the primary in postgres.yaml, same idea as docker-compose's postgres-replica. Its entrypoint script (waits for the
# primary, clones it with pg_basebackup, starts as a standby) is the ConfigMap `postgres-replica-script`, generated by the root kustomization.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
spec:
  selector:
    app: postgres-replica
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
spec:
  serviceName: postgres-replica
  replicas: 1
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      containers:
        - name: postgres
          image: postgres:17
          command: ["/scripts/replica-entrypoint.sh"]
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: script
              mountPath: /scripts
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "slotwise", "-d", "slotwise"]
            periodSeconds: 5
      volumes:
        - name: script
          configMap:
            name: postgres-replica-script
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
