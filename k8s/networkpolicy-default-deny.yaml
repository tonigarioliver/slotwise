# "Deny everything, then allow": an empty podSelector selects every Pod of the namespace, and with no ingress rule nothing may enter.
# The other networkpolicy-*.yaml files are the allow-list (policies add up: a connection passes if ANY policy that selects the Pod allows it).
# Only ingress is restricted: DNS and the calls a Pod makes are not touched. Traffic from the node itself (the kubelet's probes) is not blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
