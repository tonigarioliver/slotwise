# Keycloak in dev mode (embedded database, no volume: the realm is re-imported at every start, as in docker-compose). The realm file is the ConfigMap
# `keycloak-realm` and the admin credentials the Secret `keycloak-admin`, both generated by the root kustomization.yaml.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
            - containerPort: 9000
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef: {name: keycloak-admin, key: username}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-admin, key: password}
            # The PUBLIC name written as `iss` in every token. The services' KEYCLOAK_ISSUER_URI must be this same value (see decisions.md).
            - name: KC_HOSTNAME
              value: http://localhost:8081
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
          # Health is served on the management port 9000; the image has no curl, so Kubernetes makes the HTTP call itself.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
